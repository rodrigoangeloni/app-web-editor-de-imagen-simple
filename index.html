<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Simple de Imágenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
</head>

<body>
    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden" role="dialog" aria-modal="true"
        aria-labelledby="loadingText">
        <div class="spinner" role="status" aria-hidden="true"></div>
        <p id="loadingText">Procesando...</p>
    </div>

    <div class="container">
        <h1>Editor de Imágenes</h1>

        <!-- Info de imagen -->
        <div id="imageInfo" class="image-info hidden">
            <span id="infoDimensions">0 × 0 px</span>
            <span id="infoSize">0 KB</span>
            <span id="infoFormat">-</span>
        </div>

        <div class="upload-area" id="dropZone" role="button" tabindex="0"
            aria-label="Área para cargar imagen. Arrastra una imagen o haz clic para seleccionar">
            <p>Arrastra tu imagen aquí o haz clic para seleccionar</p>
            <input type="file" id="fileInput" accept="image/*" aria-label="Seleccionar archivo de imagen">
        </div>

        <div class="editor-container">
            <div class="image-container" role="img" aria-label="Vista previa de la imagen">
                <img id="imagePreview" style="max-width: 100%; display: none;" alt="Carga una imagen para editar">
                <div class="mask-container">
                    <canvas id="maskPreview"></canvas>
                </div>
            </div>
            <div class="controls">
                <div class="control-group">
                    <label for="quality">Calidad:</label>
                    <input type="range" id="quality" min="1" max="100" value="90" aria-valuemin="1" aria-valuemax="100" aria-valuenow="90" aria-label="Calidad de compresión">
                    <span id="qualityValue">90%</span>
                </div>
                <div class="control-group">
                    <label for="format">Formato:</label>
                    <select id="format">
                        <option value="jpeg">JPEG</option>
                        <option value="png" selected>PNG</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Redimensionar:</label>
                    <div class="size-controls">
                        <div>
                            <input type="number" id="width" placeholder="Ancho" min="1">
                            <input type="number" id="height" placeholder="Alto" min="1">
                        </div>
                        <div>
                            <select id="unit">
                                <option value="px">Píxeles</option>
                                <option value="cm">Centímetros</option>
                            </select>
                            <label class="checkbox-label">
                                <input type="checkbox" id="keepAspect" checked> Mantener relación
                            </label>
                        </div>
                    </div>
                </div>
                <div class="control-group percent-control">
                    <label for="percent">Escala (%):</label>
                    <input type="number" id="percent" min="1" max="1000" value="100" style="width: 100px">
                </div>
                <div class="control-group">
                    <label>Rotación:</label>
                    <div class="rotation-controls" role="group" aria-label="Controles de rotación y volteo">
                        <button type="button" id="rotateLeft" class="icon-btn" title="Rotar 90° izquierda (Ctrl+←)"
                            disabled aria-label="Rotar 90 grados a la izquierda">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                        <button type="button" id="rotateRight" class="icon-btn" title="Rotar 90° derecha (Ctrl+→)"
                            disabled aria-label="Rotar 90 grados a la derecha">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                        </button>
                        <button type="button" id="flipH" class="icon-btn" title="Voltear horizontal" disabled
                            aria-label="Voltear horizontalmente">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></svg>
                        </button>
                        <button type="button" id="flipV" class="icon-btn" title="Voltear vertical" disabled
                            aria-label="Voltear verticalmente">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 3 5 5 5-5H7"/><path d="m7 21 5-5 5 5H7"/><path d="M20 12h2"/><path d="M14 12h2"/><path d="M8 12h2"/><path d="M2 12h2"/></svg>
                        </button>
                    </div>
                </div>
                <div class="control-group">
                    <label for="brightness">Brillo:</label>
                    <input type="range" id="brightness" min="0" max="200" value="100"
                        title="Ajustar brillo de la imagen" aria-valuemin="0" aria-valuemax="200" aria-valuenow="100">
                    <span id="brightnessValue">100%</span>
                </div>
                <div class="control-group">
                    <label for="contrast">Contraste:</label>
                    <input type="range" id="contrast" min="0" max="200" value="100"
                        title="Ajustar contraste de la imagen" aria-valuemin="0" aria-valuemax="200"
                        aria-valuenow="100">
                    <span id="contrastValue">100%</span>
                </div>
                <div class="control-group">
                    <label for="saturation">Saturación:</label>
                    <input type="range" id="saturation" min="0" max="200" value="100"
                        title="Ajustar saturación de colores" aria-valuemin="0" aria-valuemax="200" aria-valuenow="100">
                    <span id="saturationValue">100%</span>
                </div>
                <div class="control-group">
                    <label>Filtros:</label>
                    <div class="filter-controls" role="group" aria-label="Filtros de imagen">
                        <button id="filterNone" class="filter-btn active" aria-pressed="true">Original</button>
                        <button id="filterGrayscale" class="filter-btn" aria-pressed="false">Escala de Grises</button>
                        <button id="filterSepia" class="filter-btn" aria-pressed="false">Sepia</button>
                        <button id="filterInvert" class="filter-btn" aria-pressed="false">Invertir</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Eliminar fondo:</label>
                    <label class="checkbox-label" style="margin-bottom:8px;">
                        <input type="checkbox" id="enableBgRemove"> Activar eliminación de fondo
                    </label>
                    <div class="bg-remove-controls">
                        <input type="color" id="bgColor" value="#ffffff" disabled aria-label="Color de fondo a eliminar">
                        <input type="range" id="tolerance" min="0" max="100" value="10" disabled aria-valuemin="0" aria-valuemax="100" aria-valuenow="10" aria-label="Tolerancia de eliminación de fondo">
                        <span id="toleranceValue">10%</span>
                    </div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="edgesOnly" checked disabled> Solo desde bordes (más preciso)
                    </label>
                </div>
                <div class="action-buttons" role="group" aria-label="Acciones principales">
                    <div class="history-controls" role="group" aria-label="Historial de cambios">
                        <button type="button" id="undoBtn" class="secondary-btn" title="Deshacer (Ctrl+Z)" disabled
                            aria-label="Deshacer último cambio">↩ Deshacer</button>
                        <button type="button" id="redoBtn" class="secondary-btn" title="Rehacer (Ctrl+Y)" disabled
                            aria-label="Rehacer cambio deshecho">↪ Rehacer</button>
                    </div>
                    <button type="button" id="compareBtn" class="secondary-btn"
                        title="Mantener presionado para comparar con original" disabled
                        aria-label="Comparar con imagen original"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg> Comparar</button>
                    <button type="button" id="resetBtn" class="secondary-btn danger"
                        title="Resetear todos los cambios (Escape)" disabled aria-label="Resetear todos los cambios"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        Resetear</button>
                    <button type="button" id="downloadBtn" title="Descargar imagen editada (Ctrl+S)" disabled
                        aria-label="Descargar imagen editada"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Descargar Imagen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.1.1/compressor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
